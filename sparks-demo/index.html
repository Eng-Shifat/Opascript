<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Precision Biometric Scanner Login Demo</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="demo-wrap">
    <button class="login-btn" id="loginBtn">
      <span class="btn-text" id="btnText">Login</span>

      <!-- Biometric scanner (hidden until click) -->
      <div class="scanner-wrap" id="scannerWrap">
        <svg class="fp-icon" id="fpIcon" viewBox="0 0 24 24" fill="none" stroke="white"
             stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4"/>
          <path d="M14 13.12c0 2.38 0 6.38-1 8.88"/>
          <path d="M17.29 21.02c.12-.6.43-2.3.5-3.02"/>
          <path d="M2 12a10 10 0 0 1 18-6"/>
          <path d="M2 16h.01"/>
          <path d="M21.8 16c.2-2 .131-5.354 0-6"/>
          <path d="M5 19.5C5.5 18 6 15 6 12a6 6 0 0 1 .34-2"/>
          <path d="M8.65 22c.21-.66.45-1.32.57-2"/>
          <path d="M9 6.8a6 6 0 0 1 9 5.2v2"/>
        </svg>

        <!-- Canvas sits above the icon with mix-blend-mode:screen, so the
             laser scan line brightens/glows the fingerprint strokes it
             sweeps over instead of just sitting on top of them. -->
        <canvas id="scannerCanvas"></canvas>

        <!-- Success tick — hidden until the scan completes -->
        <svg class="success-tick" id="successTick" viewBox="0 0 24 24" fill="none"
             stroke="white" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="4 12 9 17 20 6" />
        </svg>
      </div>
    </button>
  </div>

  <script src="script.js"></script>
</body>
</html>
