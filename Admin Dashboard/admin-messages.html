<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Messages — Scriptora Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="css/admin.css"/>
  <link rel="stylesheet" href="css/admin-chat.css"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>

<!-- sidebar.js inject করবে automatically -->
<script src="js/supabaseClient.js"></script>
<script src="js/topbar.js" data-title="Messages" data-sub="Client দের সাথে chat করুন"></script>
<script src="js/sidebar.js" data-page="messages"></script>

<div class="main">
  
  <!-- CONTENT -->
  <div class="content" style="padding:0; overflow:hidden; height:calc(100vh - 60px);">

    <div class="admin-chat-layout">

      <!-- LEFT: Conversation list -->
      <div class="conv-panel" id="convPanel">
        <div class="conv-header">
          <h2>Conversations</h2>
          <span class="conv-count" id="convCount">0</span>
        </div>

        <div class="conv-search-wrap">
          <input type="text" class="conv-search" id="convSearch" placeholder="Client বা order খুঁজুন..."/>
        </div>

        <div class="conv-list" id="convList">
          <div class="conv-loading">
            <div class="spinner"></div>
          </div>
        </div>
      </div>

      <!-- RIGHT: Chat area -->
      <div class="chat-area" id="chatArea">

        <!-- Empty state -->
        <div class="chat-empty-state" id="chatEmptyState">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
          <p>বাম থেকে একটি conversation বেছে নিন</p>
        </div>

        <!-- Active chat -->
        <div class="chat-box" id="adminChatBox" style="display:none">
          <div class="chat-head">
            <button class="back-mobile-btn" id="backMobileBtn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="15 18 9 12 15 6"/>
              </svg>
            </button>
            <div class="chat-head-left">
              <div class="chat-client-av" id="clientAv">?</div>
              <div>
                <div class="chat-client-name" id="clientName">—</div>
                <div class="chat-order-meta" id="chatOrderMeta">—</div>
              </div>
            </div>
            <div class="chat-head-actions">
              <span class="order-status-badge" id="chatStatusBadge"></span>
            </div>
          </div>

          <!-- Order Summary Banner -->
          <div class="admin-chat-order-summary" id="adminChatOrderSummary" style="display:none">
            <div class="acos-top">
              <span class="acos-order-no" id="adminCosOrderNo">#OPA-000000-000</span>
              <span class="order-status-badge" id="adminCosStatusBadge">—</span>
            </div>
            <div class="acos-grid">
              <div class="acos-item">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
                </svg>
                <div><span class="acos-label">DEADLINE</span><span class="acos-value" id="adminCosDeadline">—</span></div>
              </div>
              <div class="acos-item">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
                </svg>
                <div><span class="acos-label">DUE AMOUNT</span><span class="acos-value cos-due" id="adminCosDue">৳0</span></div>
              </div>
              <div class="acos-item">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="20 6 9 17 4 12"/>
                </svg>
                <div><span class="acos-label">PAID AMOUNT</span><span class="acos-value cos-paid" id="adminCosPaid">৳0</span></div>
              </div>
            </div>
          </div>

          <div class="chat-body" id="adminChatBody">
            <div class="chat-loading-wrap" id="chatLoading">
              <div class="spinner"></div>
            </div>
          </div>

          <div class="chat-reply-preview" id="adminReplyPreview" style="display:none"></div>

          <div class="chat-reply-preview" id="adminReplyPreview" style="display:none">
            <div class="crp-bar"></div>
            <div class="crp-body">
              <span class="crp-label">Reply করছেন</span>
              <span class="crp-text" id="adminCrpText"></span>
            </div>
            <button class="crp-close" id="adminCrpClose">&times;</button>
          </div>

          <div class="admin-attach-preview" id="adminAttachPreview" style="display:none"></div>

          <div class="chat-input-row">
            <input type="file" id="adminFileInput" style="display:none" accept="image/*,.pdf,.doc,.docx,.zip" />
            <button class="chat-attach-btn" id="adminAttachBtn" title="Attach file">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
            </button>
            <button class="chat-pin-btn" id="adminPinBtn" title="Send as pinned notice (📌 shows at top of client's chat)">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l1.5 5.5L19 9l-5.5 1.5L12 16l-1.5-5.5L5 9l5.5-1.5z"/></svg>
            </button>
            <textarea class="chat-input" id="adminChatInput" placeholder="Reply লিখুন... (Enter = send, Shift+Enter = নতুন লাইন)" rows="1"></textarea>
            <button class="chat-send-btn" id="adminSendBtn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="22" y1="2" x2="11" y2="13"/>
                <polygon points="22 2 15 22 11 13 2 9 22 2"/>
              </svg>
            </button>
          </div>
        </div>

      </div><!-- /chat-area -->
    </div><!-- /admin-chat-layout -->

  </div><!-- /content -->
</div><!-- /main -->

<div class="toast" id="toast"></div>

<script src="js/admin-chat.js"></script>
</body>
</html>
